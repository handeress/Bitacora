<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1b18">
<title>Bitácora de obra</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono-192.png">
<style>
:root{
  --papel:#f4f1ea; --hoja:#fffdf8; --tinta:#1d1b18; --gris:#6b655b; --linea:#d9d3c7;
  --acento:#c2410c; --proy:#c2410c; --pend:#a16207; --proc:#1d4ed8; --term:#15803d; --rojo:#b91c1c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--papel);color:var(--tinta);
  -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--tinta);color:#fff;padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top));display:flex;gap:10px;align-items:center;border-bottom:6px solid var(--proy)}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header select{background:#34302b;color:#fff;border:0;border-radius:8px;padding:9px 10px;max-width:56vw;min-height:40px}
header .guardar{background:#fff;color:var(--tinta);border:0;border-radius:8px;padding:8px 14px;min-height:40px;font-weight:700}
header .atras{background:none;border:0;color:#fff;font-size:22px;padding:4px 10px 4px 0;min-height:40px}
main{padding:12px 12px 96px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--hoja);border-top:1px solid var(--linea);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:12px 4px 10px;font-size:13px;color:var(--gris);border-top:3px solid transparent;min-height:54px}
nav button.on{color:var(--tinta);font-weight:700;border-top-color:var(--proy)}
.rapida{display:flex;gap:8px;margin-bottom:10px}
.rapida input{flex:1}
input[type=text],input[type=search],input[type=date],textarea,select.campo{width:100%;background:var(--hoja);border:1px solid var(--linea);
  border-radius:10px;padding:11px 12px;min-height:46px}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--acento);outline-offset:1px}
.btn{background:var(--tinta);color:#fff;border:0;border-radius:10px;padding:11px 16px;min-height:46px;font-weight:600}
.btn.sec{background:var(--hoja);color:var(--tinta);border:1px solid var(--linea)}
.btn.pel{background:var(--hoja);color:var(--rojo);border:1px solid var(--linea)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.chip{flex:none;background:var(--hoja);border:1px solid var(--linea);border-radius:999px;padding:8px 13px;font-size:14px;min-height:40px}
.chip.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.chip b{font-weight:700;margin-left:4px}
h2.tema{font-size:13px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--proy);margin:18px 2px 6px;display:flex;justify-content:space-between}
.fila{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:var(--hoja);border:1px solid var(--linea);
  border-radius:12px;padding:12px;margin-bottom:6px;min-height:56px}
.punto{flex:none;width:14px;height:14px;border-radius:50%;margin-top:4px;border:2px solid var(--pend)}
.punto.proceso{border-color:var(--proc);background:linear-gradient(90deg,var(--proc) 50%,transparent 50%)}
.punto.terminado{border-color:var(--term);background:var(--term)}
.fila .t{font-weight:600}
.fila.terminado .t{color:var(--gris);text-decoration:line-through}
.fila .s{font-size:13px;color:var(--gris);margin-top:2px}
.fila .s .venc{color:var(--rojo);font-weight:600}
.vacio{text-align:center;color:var(--gris);padding:40px 16px}
.aviso{background:#fef3c7;border:1px solid #f1d58a;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
label.et{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--gris);margin:16px 2px 5px}
.seg{display:flex;border:1px solid var(--linea);border-radius:10px;overflow:hidden;background:var(--hoja)}
.seg button{flex:1;background:none;border:0;padding:12px 4px;min-height:48px;font-size:14px;border-right:1px solid var(--linea)}
.seg button:last-child{border-right:0}
.seg button.on{color:#fff;font-weight:700}
.seg button.on[data-e=pendiente]{background:var(--pend)}
.seg button.on[data-e=proceso]{background:var(--proc)}
.seg button.on[data-e=terminado]{background:var(--term)}
.med{display:grid;grid-template-columns:1fr 84px 76px 40px;gap:6px;margin-bottom:6px}
.med input,.med select{min-height:44px;padding:9px 8px}
.med .x{background:none;border:0;color:var(--gris);font-size:20px}
.paso{display:grid;grid-template-columns:40px 1fr 96px 32px;gap:5px;margin-bottom:6px;align-items:center}
.paso select{min-height:44px;padding:6px 4px;font-size:13px;background:var(--hoja);border:1px solid var(--linea);border-radius:10px}
.docs a{display:block;padding:11px 12px;background:var(--hoja);border:1px solid var(--linea);border-radius:10px;margin-bottom:6px;color:var(--tinta);text-decoration:none;font-weight:600}
.docs a small{display:block;color:var(--gris);font-weight:400}
.auto{font-size:13px;color:var(--gris);margin:6px 2px 0;display:flex;justify-content:space-between;align-items:center}
.auto button{background:none;border:0;color:var(--acento);font-weight:600;padding:6px 0}
.mat{display:grid;grid-template-columns:44px 1fr 62px 74px 36px;gap:5px;margin-bottom:6px;align-items:center}
.paso input[type=text],.mat input[type=text],.mat select{min-height:44px;padding:9px 8px}
.paso input[type=checkbox],.mat input[type=checkbox]{width:26px;height:26px;margin:0 auto;accent-color:var(--term)}
.paso .x,.mat .x{background:none;border:0;color:var(--gris);font-size:20px}
.hecho{color:var(--gris);text-decoration:line-through}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.fotos .f{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--linea)}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
.fotos .q{position:absolute;top:3px;right:3px;background:rgba(29,27,24,.8);color:#fff;border:0;border-radius:50%;width:30px;height:30px;font-size:16px}
.dos{display:flex;gap:8px}
.dos>*{flex:1}
.hist{font-size:14px;color:var(--gris);border-left:3px solid var(--linea);padding:2px 0 2px 10px;margin-bottom:8px}
.hist b{color:var(--tinta)}
.tarj{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:14px;margin-bottom:10px}
.tarj h3{margin:0 0 4px;font-size:16px}
.tarj p{margin:0 0 10px;font-size:14px;color:var(--gris)}
.tarj .btn{width:100%;margin-top:6px}
.tarj .rapida .btn{width:auto;margin-top:0}
.tarj input[type=password]{width:100%;background:var(--hoja);border:1px solid var(--linea);border-radius:10px;padding:11px 12px;min-height:46px}
.proy{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--linea)}
.proy:last-of-type{border-bottom:0}
.proy span{flex:1}
.proy small{color:var(--gris)}
.proy input[type=color]{flex:none;width:42px;height:40px;padding:0;border:1px solid var(--linea);border-radius:8px;background:none}
.ev{display:block;width:100%;text-align:left;background:var(--hoja);border:1px solid var(--linea);border-left:5px solid var(--proy);border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:15px}
.ev small{color:var(--gris);display:block;margin-top:2px}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tinta);color:#fff;
  padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#visor{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:30;display:none;align-items:center;justify-content:center}
#visor.on{display:flex}
#visor img{max-width:100%;max-height:100%}
.vf{padding:0;align-items:stretch;overflow:hidden}
.vf .abre{flex:1;display:flex;gap:11px;align-items:flex-start;background:none;border:0;text-align:left;padding:12px;min-height:56px}
.vf .rev{flex:none;width:56px;border:0;border-left:1px solid var(--linea);background:none;font-size:22px;color:var(--linea)}
.vf .rev.on{background:var(--term);color:#fff}
.barra{display:grid;grid-template-columns:1.5fr 1.2fr 1fr 44px;gap:6px;margin-bottom:8px}
.barra button{background:var(--hoja);border:1px solid var(--linea);border-radius:10px;min-height:42px;padding:6px 5px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra button.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.panel{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:8px;margin-bottom:10px}
.panel button{display:flex;justify-content:space-between;gap:6px;text-align:left;background:none;border:1px solid var(--linea);border-radius:8px;padding:9px 10px;min-height:42px;font-size:14px}
.panel button.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.panel .sep{grid-column:1/-1;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);margin:4px 2px 0}
.vf .ses{flex:none;width:50px;border:0;border-left:1px solid var(--linea);background:none;font-size:22px;color:var(--linea)}
.vf .ses.on{color:var(--acento)}
.pri{color:var(--rojo);font-size:11px;font-weight:800;letter-spacing:.06em;margin-right:6px}
.fila.baja .t{font-weight:500}
.lin{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--gris);margin:0 2px 8px}
.lin button{background:none;border:0;color:var(--acento);font-weight:600;padding:8px 0}
.seg button.on[data-p]{background:var(--tinta)}
.seg button.on[data-p=alta]{background:var(--rojo)}
.grupos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.grupos.cuatro{grid-template-columns:repeat(4,1fr)}
.gr{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:6px 4px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.gr b{font-size:19px;line-height:1;color:var(--proy)}
.gr span{font-size:13px;white-space:nowrap}
.gr small{font-size:11px;color:var(--rojo);font-weight:700}
.gr.cero{opacity:.45}
.masdat{margin-top:18px;border-top:1px solid var(--linea);padding-top:6px}
.masdat summary{padding:12px 2px;color:var(--gris);font-size:14px;font-weight:600;cursor:pointer}
.vf .ok{flex:none;width:48px;border:0;border-left:1px solid var(--linea);background:none;font-size:20px;color:var(--term);font-weight:700}
.cod{flex:none;min-width:36px;font-weight:800;color:var(--proy);font-size:14px;margin-top:2px}
.fa.fut{opacity:.7;border-style:dashed}
.apaso{display:grid;grid-template-columns:24px 1fr 92px 30px;gap:5px;margin-bottom:6px;align-items:center}
.apaso .n{font-weight:700;color:var(--gris);text-align:center}
.apaso input,.apaso select{min-height:44px;padding:8px;background:var(--hoja);border:1px solid var(--linea);border-radius:10px;font-size:14px}
.amat{display:grid;grid-template-columns:1fr 58px 66px 54px 28px;gap:5px;margin-bottom:6px;align-items:center}
.amat input,.amat select{min-height:44px;padding:8px 6px;background:var(--hoja);border:1px solid var(--linea);border-radius:10px;font-size:14px}
.amat small{font-size:12px;color:var(--gris);text-align:right}
.apaso .x,.amat .x{background:none;border:0;color:var(--gris);font-size:18px}
.etq{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--proy);border-radius:6px;padding:2px 6px;margin-right:4px;vertical-align:1px}
#v3d{position:fixed;inset:0;background:#111;z-index:40;display:none;flex-direction:column}
#v3d.on{display:flex}
#v3d button{background:var(--tinta);color:#fff;border:0;padding:14px;padding-top:calc(14px + env(safe-area-inset-top));font-weight:700;text-align:left}
#v3d iframe{flex:1;border:0;width:100%;background:#fff}
nav button{font-size:12.5px}
.gact{align-items:center;border-left:5px solid var(--proy);margin:4px 0 2px;min-height:44px;padding:9px 12px}
.gact>b{font-size:16px;color:var(--proy);padding:0 4px;white-space:nowrap}
.subact{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 2px 4px;font-weight:700;font-size:14px;color:var(--tinta)}
.subact small{font-weight:400;color:var(--gris)}
#ordA{flex-wrap:wrap}
.oculto{display:none!important}
</style>
</head>
<body>
<header id="cab"></header>
<main id="main"></main>
<nav id="nav">
  <button data-v="tareas">Tareas</button>
  <button data-v="acts">Actividades</button>
  <button data-v="visita">Visita</button>
  <button data-v="diario">Diario</button>
  <button data-v="mas">Más</button>
</nav>
<div id="toast"></div>
<div id="visor"><img alt=""></div>
<div id="v3d"><button id="v3dX">✕ Cerrar 3D</button><iframe title="Visor 3D" allow="fullscreen; xr-spatial-tracking"></iframe></div>
<input type="file" id="inCam" accept="image/*" capture="environment" class="oculto">
<input type="file" id="inGal" accept="image/*" multiple class="oculto">
<input type="file" id="inArch" accept=".json,application/json" class="oculto">

<script>
'use strict';
const VERSION='8.4';
const PROY_BASE=[
  {id:'tibana-y-guaduas',nombre:'Tibaná y Guaduas',color:'#b45309'},
  {id:'silvania',nombre:'Silvania',color:'#1f6fb2'},
  {id:'suesca',nombre:'Suesca',color:'#2f7d4f'},
  {id:'fontanar',nombre:'Fontanar',color:'#7c3aed'}
];
const PALETA=['#be185d','#0e7490','#4d7c0f','#9a3412','#4338ca','#a16207'];
const colorProy=id=>(proyectos.find(p=>p.id===id)||{}).color||'#c2410c';
const TEMAS=['Medidas para compras','Revisar','Corregir','Definir','Hacer','Sin clasificar'];
const UNIDADES=['m','cm','mm','m²','m³','und','kg','"','otro'];
const MAT_UNID=['und','m','m²','m³','kg','bulto','gl','otro'];
const norm=t=>{t.medidas=t.medidas||[];t.fotos=t.fotos||[];t.historial=t.historial||[];t.pasos=t.pasos||[];t.materiales=t.materiales||[];t.tipo=t.tipo||'';t.prioridad=t.prioridad||'';t.sesion=!!t.sesion;t.claude=!!t.claude;t.estadoFijo=!!t.estadoFijo;t.docs=t.docs||[];t.actividad=t.actividad||'';t.pasos.forEach(p=>{p.tipo=p.tipo||'';});return t;};
function autoEtapas(t){ if(!t.pasos.length) return; const pend=t.pasos.find(p=>!p.hecho);
  if(t.pasos.some(p=>p.tipo)){ if(pend&&pend.tipo) t.tipo=pend.tipo; else if(!pend){ const u=[...t.pasos].reverse().find(p=>p.tipo); if(u) t.tipo=u.tipo; } }
  if(t.estadoFijo) return; const n=t.pasos.filter(p=>p.hecho).length; t.estado=n===0?'pendiente':(n===t.pasos.length?'terminado':'proceso'); }
const FORMATO=8;
const TIPOS=[['comprar','Comprar','Comprar'],['fabricar','Mandar a fabricar','Fabricar'],['armar','Armar en taller','Armar'],['transportar','Transportar','Transportar'],['construir','Construir en obra','Construir'],['planos','Hacer planos','Planos'],['medir','Tomar medidas','Medir'],['definir','Definir especificaciones','Definir'],['revisar','Revisar en obra','Revisar']];
const tipoNom=(k,c)=>{const x=TIPOS.find(y=>y[0]===k);return x?x[c?2:1]:'';};
const GH={dueno:'handeress',repo:'Bitacora-datos'};
const ESTADOS={pendiente:'Pendiente',proceso:'En proceso',terminado:'Terminado'};

/* ---------- base de datos ---------- */
let db;
function abrir(){
  return new Promise((ok,no)=>{
    const r=indexedDB.open('bitacora',3);
    r.onupgradeneeded=()=>{
      const d=r.result;
      [['proyectos','id'],['tareas','id'],['fotos','id'],['meta','k'],['visitas','id'],['actividades','id']].forEach(s=>{ if(!d.objectStoreNames.contains(s[0])) d.createObjectStore(s[0],{keyPath:s[1]}); });
    };
    r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error);
  });
}
function tx(store,modo,fn){
  return new Promise((ok,no)=>{
    const t=db.transaction(store,modo); const s=t.objectStore(store); const r=fn(s);
    t.oncomplete=()=>ok(r&&r.result); t.onerror=()=>no(t.error); t.onabort=()=>no(t.error);
  });
}
const dbAll=s=>tx(s,'readonly',o=>o.getAll());
const dbGet=(s,k)=>tx(s,'readonly',o=>o.get(k));
const dbPut=(s,v)=>tx(s,'readwrite',o=>o.put(v));
const dbDel=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
const dbClear=s=>tx(s,'readwrite',o=>o.clear());

/* ---------- estado ---------- */
let proyectos=[], tareas=[], visitas=[];
const S={vista:'tareas', proy:'', grupo:'', verTerm:false, nueva:false, q:'', tarea:null, urls:[], ordenA:'trabajo'};
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const ahora=()=>new Date().toISOString();
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function fecha(iso){ if(!iso) return ''; const p=iso.slice(0,10).split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fechaHora(iso){ const d=new Date(iso); return fecha(iso.length>10? d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'):iso)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
let tt; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600);}
const nombreProy=id=>(proyectos.find(p=>p.id===id)||{}).nombre||id;

/* ---------- arranque ---------- */
async function iniciar(){
  db=await abrir();
  proyectos=await dbAll('proyectos');
  if(!proyectos.length){ for(const p of PROY_BASE){ const o={...p,estado:'activo'}; await dbPut('proyectos',o); proyectos.push(o);} }
  for(const p of proyectos){ if(!p.color){ p.color=(PROY_BASE.find(b=>b.id===p.id)||{}).color||PALETA[proyectos.indexOf(p)%PALETA.length]; await dbPut('proyectos',p);} }
  tareas=(await dbAll('tareas')).map(norm); visitas=await dbAll('visitas'); actividades=(await dbAll('actividades')).map(normA);
  const m=await dbGet('meta','proy'); S.proy=(m&&proyectos.some(p=>p.id===m.v))?m.v:proyectos[0].id;
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();
  sinc.token=((await dbGet('meta','token'))||{}).v||''; sinc.borradas=((await dbGet('meta','borradas'))||{}).v||{}; sinc.aplicadas=((await dbGet('meta','entrada'))||{}).v||[];
  S.ordenA=((await dbGet('meta','ordenA'))||{}).v||'trabajo'; sinc.ultimo=((await dbGet('meta','sinc'))||{}).v||''; sinc.firma=((await dbGet('meta','firma'))||{}).v||'';
  leerLugar(); pintar(); if(lugar3D){const u=lugar3D;lugar3D='';abrir3D(u);} sincronizar();
}

/* ---------- pintar ---------- */
function pintar(){
  const tf=S.vista==='ficha'&&tareas.find(x=>x.id===S.tarea), af=S.vista==='act'&&actividades.find(x=>x.id===S.act);
  document.documentElement.style.setProperty('--proy',colorProy(tf?tf.proyecto:af?af.proyecto:S.proy));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.vista));
  $('#nav').classList.toggle('oculto',S.vista==='ficha'||S.vista==='act');
  if(S.vista==='tareas'){cabecera();vistaTareas();}
  else if(S.vista==='ficha'){vistaFicha();}
  else if(S.vista==='acts'){cabecera();vistaActs();}
  else if(S.vista==='act'){vistaAct();}

let actividades=[];
const ACT_UNID=['und','m','ml','m²','m³','kg','glb','punto','viaje'];
const ARCH_TIPOS=['Plano','Despiece','3D','Documento','Foto'];
const numx=s=>parseFloat(String(s==null?'':s).replace(',','.'))||0;
const fmtx=x=>String(Math.round(x*100)/100).replace('.',',');
const normA=a=>{a.proceso=a.proceso||[];a.materiales=a.materiales||[];a.herramientas=a.herramientas||[];a.antes=a.antes||[];a.archivos=a.archivos||[];a.futuro=!!a.futuro;a.codigo=a.codigo||'';a.capitulo=a.capitulo||'';a.nombre=a.nombre||'';a.unidad=a.unidad||'und';a.cantidad=a.cantidad==null?'':String(a.cantidad);a.descripcion=a.descripcion||'';return a;};
const actsProy=()=>actividades.filter(a=>a.proyecto===S.proy);
const claveCod=a=>String(a.codigo||'zz').split('.').map(n=>n.padStart(4,'0')).join('.');
const ordenCod=(x,y)=>claveCod(x)<claveCod(y)?-1:claveCod(x)>claveCod(y)?1:0;
const tareasDe=id=>tareas.filter(t=>t.actividad===id);
const completa=a=>{const ts=tareasDe(a.id);return ts.length>0&&ts.every(t=>t.estado==='terminado');};
const esperando=a=>a.antes.map(i=>actividades.find(x=>x.id===i)).filter(b=>b&&!completa(b));
function nivelAct(a,vis){ if(completa(a))return -1; vis=vis||new Set(); if(vis.has(a.id))return 0; vis.add(a.id);
  const es=esperando(a); if(!es.length){vis.delete(a.id);return 0;} const n=1+Math.max(...es.map(b=>nivelAct(b,vis))); vis.delete(a.id); return n; }
const RANGO={proceso:0,lista:1,bloqueada:2,completa:3};
const claveTrabajo=a=>[a.futuro?2:(completa(a)?1:0), Math.max(0,nivelAct(a)), RANGO[estadoAct(a)], claveCod(a)];
function ordenTrabajo(x,y){const a=claveTrabajo(x),b=claveTrabajo(y);for(let i=0;i<4;i++){if(a[i]<b[i])return -1;if(a[i]>b[i])return 1;}return 0;}
const nomEtapa=n=>n===0?'Etapa 1 · se puede hacer ya':'Etapa '+(n+1)+' · después de la etapa '+n;
function estadoAct(a){ if(completa(a))return 'completa'; if(esperando(a).length)return 'bloqueada'; return tareasDe(a.id).some(t=>t.estado!=='pendiente')?'proceso':'lista'; }
const EA={completa:['Completa','var(--term)'],bloqueada:['Bloqueada','var(--gris)'],proceso:['En curso','var(--proc)'],lista:['Lista para empezar','var(--pend)']};
function filaAct(a){
  const ts=tareasDe(a.id),hz=ts.filter(t=>t.estado==='terminado').length,ea=estadoAct(a),e=a.futuro?['Futuro','var(--gris)']:EA[ea];
  const s=[ts.length?hz+'/'+ts.length+(ts.length===1?' tarea':' tareas'):'Sin tareas'];
  if(a.cantidad) s.push(esc(a.cantidad)+' '+esc(a.unidad));
  if(a.archivos.length) s.push(a.archivos.length+(a.archivos.length===1?' archivo':' archivos'));
  if(!a.futuro&&ea==='bloqueada') s.push('Espera '+esperando(a).map(x=>esc(x.codigo||x.nombre)).join(', '));
  return '<button class="fila fa'+(a.futuro?' fut':'')+'" data-id="'+a.id+'"><span class="cod">'+esc(a.codigo)+'</span><span style="flex:1"><div class="t">'+esc(a.nombre||'(sin nombre)')+'</div><div class="s"><b style="color:'+e[1]+'">'+e[0]+'</b> · '+s.join(' · ')+'</div></span></button>';
}

  const pinta=()=>{
    document.querySelectorAll('#ordA .chip').forEach(b=>b.classList.toggle('on',b.dataset.o===S.ordenA));
    const l=actsProy().sort(ordenCod), q=(S.qa||'').trim().toLowerCase();

    const caps={}; let lista=ab.slice(), clave;
    if(S.ordenA==='trabajo'){ lista.sort(ordenTrabajo); clave=a=>completa(a)?'Completas':nomEtapa(Math.max(0,nivelAct(a))); }
    else if(S.ordenA==='estado'){ lista.sort((x,y)=>RANGO[estadoAct(x)]-RANGO[estadoAct(y)]||ordenCod(x,y)); clave=a=>EA[estadoAct(a)][0]; }
    else clave=a=>a.capitulo||'Sin capítulo';

    Object.keys(caps).forEach(k=>{c+='<h2 class="tema"><span>'+esc(k)+'</span><span>'+caps[k].length+'</span></h2>'+caps[k].map(filaAct).join('');});
    if(fut.length) c+='<h2 class="tema"><span>Futuro</span><span>'+fut.length+'</span></h2>'+fut.map(filaAct).join('');
    $('#cuerpoA').innerHTML=c;
    document.querySelectorAll('.fa').forEach(b=>b.onclick=()=>{S.act=b.dataset.id;S.volverA='acts';S.vista='act';pintar();window.scrollTo(0,0);});
  };
  document.querySelectorAll('#ordA .chip').forEach(b=>b.onclick=()=>{S.ordenA=b.dataset.o;dbPut('meta',{k:'ordenA',v:S.ordenA});pinta();});
  pinta();
  $('#busA').oninput=e=>{S.qa=e.target.value;clearTimeout(S._qa);S._qa=setTimeout(pinta,200);};
  $('#nAct').onclick=async()=>{const a=normA({id:'a'+uid(),proyecto:S.proy,nombre:(S.qa||'').trim(),creado:ahora(),actualizado:ahora()});actividades.push(a);await dbPut('actividades',a);programar();S.qa='';S.act=a.id;S.volverA='acts';S.vista='act';S.nueva=true;pintar();window.scrollTo(0,0);};
}

.exT;}catch(e){}\n    try{if(s.cam){cam.t=s.cam.t;cam.r=s.cam.r;cam.yaw=s.cam.yaw;cam.pitch=s.cam.pitch;}if(V.markView)V.markView('');}catch(e){}\n    try{if(V.refresh)V.refresh();if(V.req)V.req();}catch(e){}\n    ult=JSON.stringify(Object.assign({},leer(),{t:0}));}\n  poner();\n  if(ok)setInterval(guardar,1000);\n  document.addEventListener('visibilitychange',function(){if(document.hidden){guardar();}else if(glPerdido()){guardar();location.reload();}});\n  window.addEventListener('pagehide',guardar);\n  window.addEventListener('pageshow',function(){if(glPerdido())location.reload();});\n})();\n",VISOR_EXP=";try{window.__V={cam:cam,state:state,PARTS:PARTS,MOVS:(typeof MOVS!=='undefined'?MOVS:[]),filtrar:(typeof filtrar==='function'?filtrar:null),syncOpen:(typeof syncOpen==='function'?syncOpen:null),setClip:(typeof setClip==='function'?setClip:null),markView:(typeof markView==='function'?markView:null),refresh:(typeof refresh==='function'?refresh:null),req:(typeof req==='function'?req:null)};}catch(e){}\n";

const cache3D={};
async function abrir3D(u){const orig=u;
  if(u.startsWith('repo:')){ const ruta=u.slice(5);
    if(!cache3D[ruta]){ if(!sinc.token) return toast('Falta la llave de GitHub (Más)'); if(!navigator.onLine) return toast('Sin internet para bajar el 3D');
      toast('Cargando 3D…'); try{ const r=await gh(ruta,{headers:{'Accept':'application/vnd.github.raw+json'}}); if(!r.ok) throw falla(r);
        cache3D[ruta]=URL.createObjectURL(new Blob([conGuardado(await r.text(),'bitacora:'+ruta)],{type:'text/html'})); }catch(e){ return toast('No se pudo cargar el 3D'); } }
    u=cache3D[ruta]; }
  else if(/drive\.google\.com\/file\/d\//.test(u)) u=u.replace(/\/(view|edit)(\?.*)?$/,'/preview');
  S.v3d=orig; guardarLugar();
  irIframe(u); $('#v3d').classList.add('on'); }

function infoTarea(t){
  const s=[t.tema]; if(tipoNom(t.tipo))s.push(tipoNom(t.tipo)); if(t.estado==='proceso')s.push('En proceso'); if(t.estado==='terminado')s.push('Terminado');
  if(t.pasos.length){ const sg=t.pasos.find(x=>!x.hecho); s.push(t.pasos.filter(x=>x.hecho).length+'/'+t.pasos.length+' etapas'+(sg&&sg.texto?' · Sigue: '+sg.texto:'')); }
  const pm=t.medidas.filter(m=>m.valor===''&&m.nombre).length; if(pm)s.push(pm+' por medir');
  const fm=t.materiales.filter(m=>!m.listo).length; if(fm)s.push(fm+(fm===1?' material falta':' materiales faltan'));
  return s.map(esc).join(' · ');
}

/* ---------- fotos ---------- */
function reducir(file){
  return new Promise((ok,no)=>{
    const img=new Image(); const u=URL.createObjectURL(file);
    img.onload=()=>{const M=1600;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);
      c.toBlob(b=>b?ok(b):no(new Error('foto')),'image/jpeg',0.78);};
    img.onerror=()=>{URL.revokeObjectURL(u);no(new Error('foto'));};
    img.src=u;
  });
}

  guardar(t);pintarFotos(t);toast(n?(n===1?'Foto guardada':n+' fotos guardadas'):'No se pudo leer la foto');
}

function textoLista(){
  const ts=delProyecto(); const marca={pendiente:'[ ]',proceso:'[~]',terminado:'[x]'};
  let s='BITÁCORA · '+nombreProy(S.proy)+' · '+fecha(hoy())+'\n[ ] pendiente  [~] en proceso  [x] terminado\n';
  const g={}; ts.forEach(t=>(g[t.tema||'Sin clasificar']=g[t.tema||'Sin clasificar']||[]).push(t));
  Object.keys(g).forEach(k=>{s+='\n'+k.toUpperCase()+'\n';
    g[k].forEach(t=>{s+=marca[t.estado]+' '+t.titulo+'\n';
      const mk=[];if(tipoNom(t.tipo))mk.push('Tipo: '+tipoNom(t.tipo));if(t.prioridad)mk.push('Prioridad '+t.prioridad);if(t.sesion)mk.push('En sesión');if(t.claude)mk.push('Para Claude');if(mk.length)s+='    '+mk.join(' · ')+'\n';
      if(t.detalle)s+='    Hacer: '+t.detalle.replace(/\n/g,' ')+'\n';

      if(t.pasos.length)s+='    Etapas: '+t.pasos.map(x=>(x.hecho?'[x] ':'[ ] ')+x.texto+(tipoNom(x.tipo)?' ('+tipoNom(x.tipo,1)+')':'')).join('; ')+'\n';
      if(t.docs.length)s+='    Planos: '+t.docs.map(x=>x.nombre).join('; ')+'\n';
      if(t.materiales.length)s+='    Materiales: '+t.materiales.map(x=>x.nombre+(x.cantidad?' '+x.cantidad+(x.unidad==='otro'?'':' '+x.unidad):'')+(x.listo?' (en obra)':' (falta)')).join('; ')+'\n';
      const pm=t.medidas.filter(x=>x.valor===''&&x.nombre);if(pm.length)s+='    Por medir: '+pm.map(x=>x.nombre).join('; ')+'\n';
      const m=t.medidas.filter(x=>x.valor!=='');if(m.length)s+='    Medidas: '+m.map(x=>(x.nombre?x.nombre+' ':'')+x.valor+(x.unidad==='otro'?'':' '+x.unidad)).join('; ')+'\n';
      const e=[];if(t.responsable)e.push('Responsable: '+t.responsable);if(t.limite)e.push('Límite: '+fecha(t.limite));if(t.fotos.length)e.push(t.fotos.length+' foto(s)');

      if(e.length)s+='    '+e.join(' · ')+'\n';});});

async function sumarDatos(d){
  let nt=0;
  for(const p of d.proyectos||[]){ if(p&&p.id&&!proyectos.some(x=>x.id===p.id)){await dbPut('proyectos',p);proyectos.push(p);} }
  for(const t of d.tareas||[]){ if(!t||!t.id)continue; norm(t); t.estado=ESTADOS[t.estado]?t.estado:'pendiente'; t.creado=t.creado||ahora(); t.actualizado=t.actualizado||t.creado;
    t.titulo=t.titulo||'';t.detalle=t.detalle||'';t.respuesta=t.respuesta||'';t.tema=t.tema||'Sin clasificar';t.responsable=t.responsable||'';t.limite=t.limite||'';
    const i=tareas.findIndex(x=>x.id===t.id);
    if(i<0){tareas.push(t);await dbPut('tareas',t);nt++;}
    else if((t.actualizado||'')>(tareas[i].actualizado||'')){tareas[i]=t;await dbPut('tareas',t);nt++;} }
  for(const ft of d.fotos||[]){ if(!ft.data||await dbGet('fotos',ft.id))continue; const blob=await (await fetch(ft.data)).blob(); await dbPut('fotos',{id:ft.id,tarea:ft.tarea,fecha:ft.fecha,blob}); }
  for(const c of d.cambios||[]){ const t=tareas.find(x=>x.id===(c&&c.id)); if(!t||!c.campos)continue;
    const de=t.estado; Object.assign(t,c.campos); t.id=c.id; norm(t); if(!ESTADOS[t.estado])t.estado=de; if(!('estado' in c.campos)) autoEtapas(t);
    if(t.estado!==de) t.historial.push({fecha:ahora(),de,a:t.estado,nota:c.nota||'Cambio desde el chat'});
    t.actualizado=ahora(); await dbPut('tareas',t); nt++; }
  for(const a of d.actividades||[]){ if(!a||!a.id)continue; normA(a); a.creado=a.creado||ahora(); a.actualizado=a.actualizado||ahora();
    const i=actividades.findIndex(x=>x.id===a.id);
    if(i<0){actividades.push(a);await dbPut('actividades',a);nt++;} else if(a.actualizado>(actividades[i].actualizado||'')){actividades[i]=a;await dbPut('actividades',a);nt++;} }
  for(const id of d.borrar||[]){ const ia=actividades.findIndex(x=>x.id===id); if(ia>=0){await lapida(id);await dbDel('actividades',id);actividades.splice(ia,1);nt++;continue;}
    await lapida(id); const i=tareas.findIndex(x=>x.id===id); if(i<0)continue;
    for(const f of tareas[i].fotos||[]) await dbDel('fotos',f); await dbDel('tareas',id); tareas.splice(i,1); nt++; }
  for(const v of d.visitas||[]){ if(!v||!v.id||visitas.some(x=>x.id===v.id))continue; v.revisadas=v.revisadas||[];v.nuevas=v.nuevas||[]; visitas.push(v); await dbPut('visitas',v); }
  return nt;
}

/* ---------- sincronización con el repositorio de datos ---------- */
const sinc={token:'',aplicadas:[],ultimo:'',firma:'',error:'',ocupado:false,pide:false,borradas:{}};
async function lapida(id){ sinc.borradas[id]=ahora(); await dbPut('meta',{k:'borradas',v:sinc.borradas}); }
let sincT;
function programar(){ clearTimeout(sincT); sincT=setTimeout(()=>sincronizar(),15000); }
function estadoSinc(){
  if(!sinc.token) return 'Sin llave: la app no está enviando nada a Claude.';
  if(sinc.ocupado) return 'Sincronizando…';
  if(sinc.error) return 'No se pudo sincronizar: '+sinc.error+(sinc.ultimo?' Última vez bien: '+fechaHora(sinc.ultimo)+'.':'');
  return sinc.ultimo?'Al día. Última sincronización: '+fechaHora(sinc.ultimo)+'.':'Llave guardada. Todavía no ha sincronizado.';
}
function b64txt(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
function hashTxt(s){let x=5381;for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return s.length+':'+x;}
function gh(ruta,opt){
  opt=opt||{};
  return fetch('https://api.github.com/repos/'+GH.dueno+'/'+GH.repo+'/contents/'+ruta.split('/').map(encodeURIComponent).join('/'),
    {method:opt.method||'GET',body:opt.body,cache:'no-store',headers:Object.assign({'Authorization':'Bearer '+sinc.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},opt.headers||{})});
}
function falla(r){
  if(r.status===401) return new Error('la llave no sirve o venció.');
  if(r.status===403||r.status===404) return new Error('la llave no tiene permiso sobre '+GH.repo+'.');
  return new Error('GitHub respondió '+r.status+'.');
}
function txtB64(b64){const s=atob(b64.replace(/\n/g,''));const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder().decode(u);}
async function bajarRemoto(){
  const g=await gh('app/tareas.json');
  if(g.status===404) return {datos:null,sha:undefined};
  if(!g.ok) throw falla(g);
  const j=await g.json(); let txt;
  if(j.content) txt=txtB64(j.content);
  else { const r=await gh('app/tareas.json',{headers:{'Accept':'application/vnd.github.raw+json'}}); if(!r.ok) throw falla(r); txt=await r.text(); }
  let d=null; try{d=JSON.parse(txt);}catch(e){}
  return {datos:d,sha:j.sha};
}
async function fusionar(r){
  let cambios=0;
  for(const [id,f] of Object.entries(r.borradas||{})) if(!sinc.borradas[id]||f>sinc.borradas[id]) sinc.borradas[id]=f;
  await dbPut('meta',{k:'borradas',v:sinc.borradas});
  for(const [id,f] of Object.entries(sinc.borradas)){ const i=tareas.findIndex(x=>x.id===id);
    if(i>=0&&(tareas[i].actualizado||'')<=f){ for(const ft of tareas[i].fotos||[]) await dbDel('fotos',ft); await dbDel('tareas',id); tareas.splice(i,1); cambios++; } }
  for(const [id,f] of Object.entries(sinc.borradas)){ const i=actividades.findIndex(x=>x.id===id); if(i>=0&&(actividades[i].actualizado||'')<=f){ await dbDel('actividades',id); actividades.splice(i,1); cambios++; } }
  for(const a of r.actividades||[]){ if(!a||!a.id)continue; if(sinc.borradas[a.id]&&sinc.borradas[a.id]>=(a.actualizado||''))continue; const i=actividades.findIndex(x=>x.id===a.id);
    if(i<0){normA(a);actividades.push(a);await dbPut('actividades',a);cambios++;} else if((a.actualizado||'')>(actividades[i].actualizado||'')){ if(S.vista==='act'&&S.act===a.id) continue; normA(a);actividades[i]=a;await dbPut('actividades',a);cambios++;} }
  for(const p of r.proyectos||[]){ if(!p||!p.id)continue; const i=proyectos.findIndex(x=>x.id===p.id);
    if(i<0){proyectos.push(p);await dbPut('proyectos',p);cambios++;} else if((p.actualizado||'')>(proyectos[i].actualizado||'')){proyectos[i]=p;await dbPut('proyectos',p);cambios++;} }
  for(const t of r.tareas||[]){ if(!t||!t.id)continue; if(sinc.borradas[t.id]&&sinc.borradas[t.id]>=(t.actualizado||''))continue;
    const i=tareas.findIndex(x=>x.id===t.id);
    if(i<0){norm(t);tareas.push(t);await dbPut('tareas',t);cambios++;}
    else if((t.actualizado||'')>(tareas[i].actualizado||'')){ if(S.vista==='ficha'&&S.tarea===t.id) continue; norm(t);tareas[i]=t;await dbPut('tareas',t);cambios++;} }
  for(const v of r.visitas||[]){ if(!v||!v.id)continue; const i=visitas.findIndex(x=>x.id===v.id);
    if(i<0){visitas.push(v);await dbPut('visitas',v);cambios++;} else if((v.actualizado||'')>(visitas[i].actualizado||'')){visitas[i]=v;await dbPut('visitas',v);cambios++;} }
  for(const k of r.aplicadas||[]) if(!sinc.aplicadas.includes(k)) sinc.aplicadas.push(k);
  await dbPut('meta',{k:'entrada',v:sinc.aplicadas});
  return cambios;
}
function estadoParaSubir(){ return {app:'bitacora',formato:2,proyectos,tareas,visitas,actividades,borradas:sinc.borradas,aplicadas:sinc.aplicadas}; }
async function sincronizar(manual,reintento){
  if(!sinc.token){ if(manual)toast('Falta la llave'); return; }
  if(sinc.ocupado){ sinc.otraVez=true; return; }
  if(!navigator.onLine){ if(manual)toast('Sin internet'); return; }
  sinc.ocupado=true; clearTimeout(sincT); let entraron=0, llegaron=0, otra=false;
  const ver=()=>{const e=$('#sEst'); if(e) e.textContent=estadoSinc();}; ver();
  try{
    // 1. Bajar lo que subieron los otros aparatos y juntarlo
    const rem=await bajarRemoto(); const vacio=!tareas.length;
    if(rem.datos&&rem.datos.app==='bitacora') llegaron=await fusionar(rem.datos);
    // 2. Lo que Claude dejó para la app (un aparato nuevo no lo repite si el repo ya lo tiene aplicado)
    sinc.pide=false;
    const nuevo=!!(rem.datos&&vacio);
    for(const dir of ['claude/entrada','claude/buzon']){
      const l=await gh(dir);
      if(l.status===401) throw falla(l);
      if(l.status!==200) continue;
      const arch=(await l.json()).filter(x=>x.type==='file'&&/\.json$/.test(x.name)).sort((a,b)=>a.name<b.name?-1:1);
      for(const f of arch){ const clave=(dir==='claude/buzon'?'buzon/':'')+f.name; if(sinc.aplicadas.includes(clave))continue;
        if(nuevo){ sinc.aplicadas.push(clave); continue; }
        const r=await gh(dir+'/'+f.name,{headers:{'Accept':'application/vnd.github.raw+json'}}); if(!r.ok)throw falla(r);
        let d; try{d=JSON.parse(await r.text());}catch(e){d=null;}
        if(d&&d.min>FORMATO){ sinc.pide=true; continue; }
        if(d&&d.app==='bitacora') entraron+=await sumarDatos(d);
        sinc.aplicadas.push(clave); await dbPut('meta',{k:'entrada',v:sinc.aplicadas}); }
    }
    await dbPut('meta',{k:'entrada',v:sinc.aplicadas});
    // 3. Subir fotos nuevas de este aparato
    for(const f of await dbAll('fotos')){ if(f.subida||!tareas.some(t=>t.id===f.tarea))continue;
      const data=(await aData(f.blob)).split(',')[1];
      const r=await gh('app/fotos/'+f.id+'.jpg',{method:'PUT',body:JSON.stringify({message:'foto '+f.id,content:data})});
      if(!r.ok&&r.status!==422) throw falla(r);
      f.subida=true; await dbPut('fotos',f); }
    // 4. Bajar fotos que tomaron otros aparatos
    for(const t of tareas){ for(const id of t.fotos||[]){ if(await dbGet('fotos',id)) continue;
      const r=await gh('app/fotos/'+id+'.jpg',{headers:{'Accept':'application/vnd.github.raw+json'}});
      if(r.status===404) continue; if(!r.ok) throw falla(r);
      const blob=await r.blob(); await dbPut('fotos',{id,tarea:t.id,fecha:ahora(),blob,subida:true}); } }
    // 5. Subir el estado juntado si cambió
    const cuerpo=JSON.stringify(estadoParaSubir()); const firma=hashTxt(cuerpo);
    const firmaRem=rem.datos?hashTxt(JSON.stringify({app:'bitacora',formato:2,proyectos:rem.datos.proyectos,tareas:rem.datos.tareas,visitas:rem.datos.visitas,actividades:rem.datos.actividades||[],borradas:rem.datos.borradas,aplicadas:rem.datos.aplicadas})):'';
    if(firma!==firmaRem){
      const txt=JSON.stringify(Object.assign({fecha:ahora()},estadoParaSubir()),null,1);
      const r=await gh('app/tareas.json',{method:'PUT',body:JSON.stringify({message:'tareas '+hoy(),content:b64txt(txt),sha:rem.sha})});
      if(r.status===409||r.status===422){ otra=!reintento; if(!otra) throw new Error('otro aparato estaba subiendo al mismo tiempo; se reintenta en un momento.'); }
      else if(!r.ok) throw falla(r);
    }
    sinc.firma=firma; await dbPut('meta',{k:'firma',v:firma});
    sinc.ultimo=ahora(); sinc.error=''; await dbPut('meta',{k:'sinc',v:sinc.ultimo});
    if(manual||entraron||llegaron) toast(entraron?entraron+(entraron===1?' tarea nueva de Claude':' tareas nuevas de Claude'):(llegaron?'Llegaron cambios de otro aparato':'Sincronizado'));
  }catch(e){ sinc.error=(e&&e.message)||'error de red.'; if(manual)toast('No se pudo sincronizar'); }
  sinc.ocupado=false; ver();
  if(otra){ return sincronizar(manual,true); }
  if(sinc.otraVez){ sinc.otraVez=false; return sincronizar(); }
  if((entraron||llegaron)&&S.vista!=='ficha'&&S.vista!=='act') pintar();
}
setInterval(()=>{ if(document.visibilityState==='visible') sincronizar(); },60000);
window.addEventListener('online',()=>sincronizar());
function guardarYa(){ clearTimeout(guardarAT); const ax=actividades.find(x=>x.id===S.act); if(ax&&db){ try{ db.transaction('actividades','readwrite').objectStore('actividades').put(ax); }catch(e){} } clearTimeout(guardarT); const t=tareas.find(x=>x.id===S.tarea); if(t&&db){ try{ db.transaction('tareas','readwrite').objectStore('tareas').put(t); }catch(e){} } }
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') sincronizar();
  else { guardarYa(); sincronizar(); }
});

let modoArch='sumar';
$('#inArch').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f)return;
  let d; try{d=JSON.parse(await f.text());}catch(x){return toast('El archivo no se pudo leer');}
  if(!d||d.app!=='bitacora'||!Array.isArray(d.tareas))return toast('No es un respaldo de Bitácora');
  if(modoArch==='restaurar'){await dbClear('tareas');await dbClear('fotos');await dbClear('proyectos');await dbClear('visitas');await dbClear('actividades');proyectos=[];tareas=[];visitas=[];actividades=[];}
  const nt=await sumarDatos(d);
  if(!proyectos.length){for(const p of PROY_BASE){const o={...p,estado:'activo'};await dbPut('proyectos',o);proyectos.push(o);}}
  if(!proyectos.some(p=>p.id===S.proy))S.proy=proyectos[0].id;
  toast(modoArch==='restaurar'?'Restaurado: '+tareas.length+' tareas':nt+' tareas sumadas o actualizadas'); pintar();
};

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
iniciar().catch(e=>{$('#main').innerHTML='<div class="vacio">No se pudo abrir la base de datos de la app.<br>'+esc(e&&e.message||e)+'</div>';});
